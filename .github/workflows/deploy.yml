
name: Deploy SkillBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skillbridge_fullstack/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: skillbridge_fullstack/frontend

      - name: Build React app
        run: npm run build
        working-directory: skillbridge_fullstack/frontend

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: skillbridge_fullstack/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
